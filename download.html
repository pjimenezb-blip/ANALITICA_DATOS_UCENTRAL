<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Descargar Presentacion Humata AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f0f1a;
      color: #fff;
      font-family: system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #1a1a2e;
      border: 1px solid #3333557a;
      border-radius: 16px;
      padding: 48px 56px;
      text-align: center;
      max-width: 480px;
      width: 100%;
    }
    .icon {
      font-size: 56px;
      margin-bottom: 20px;
    }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
    p  { font-size: 14px; color: #8888aa; margin-bottom: 32px; line-height: 1.6; }
    .badge {
      display: inline-block;
      background: #22222e;
      border: 1px solid #33335588;
      border-radius: 999px;
      padding: 4px 14px;
      font-size: 12px;
      color: #8888aa;
      margin-bottom: 28px;
    }
    a.btn {
      display: inline-block;
      background: #6366f1;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      padding: 14px 36px;
      border-radius: 10px;
      transition: background 0.2s;
    }
    a.btn:hover { background: #4f52d4; }
    .meta {
      margin-top: 20px;
      font-size: 12px;
      color: #55557a;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📊</div>
    <h1>Humata AI — Presentacion</h1>
    <p>Presentacion de 7 diapositivas sobre Humata AI:<br>
       que es, para que se usa, caracteristicas,<br>
       nuevas formas de investigar, planes y tarifas.</p>
    <div class="badge">PowerPoint · 7 diapositivas · 45 KB</div><br>
    <a class="btn" id="dl" download="Humata_AI_Presentacion.pptx">
      Descargar .pptx
    </a>
    <div class="meta">Compatible con PowerPoint, Keynote y Google Slides</div>
  </div>
  <script>
    var b64 = "";
    var bin = atob(b64);
    var arr = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    var blob = new Blob([arr], {type: "application/vnd.openxmlformats-officedocument.presentationml.presentation"});
    var url  = URL.createObjectURL(blob);
    document.getElementById("dl").href = url;
  </script>
</body>
</html>
